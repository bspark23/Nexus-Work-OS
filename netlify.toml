[build]
  command = "npm install && npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# Secrets scanning — these values appear in source as env var references, not actual secrets
[build.processing]
  skip_processing = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 3000
