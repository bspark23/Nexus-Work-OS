[build]
  command = "npm run build:netlify"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "FIREBASE_MIGRATION.md,src/integrations/firebase/config.ts,src/integrations/firebase/admin.server.ts"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[functions]
  directory = ".output/server"
  node_bundler = "esbuild"
