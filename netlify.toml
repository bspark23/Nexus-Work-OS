[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "FIREBASE_MIGRATION.md,src/integrations/firebase/config.ts,src/integrations/firebase/admin.server.ts"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
